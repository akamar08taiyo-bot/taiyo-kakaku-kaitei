<style>

  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }

  .fld input { padding: 8px 11px; font-size: 13.5px; }

  .fld textarea { padding: 8px 11px; font-size: 13px; line-height: 1.6; resize: vertical; }
  .panel { padding-top: 13px; border-top: 1px solid #cfdaea; display: flex; flex-direction: column; gap: 11px; }
  .panel .note { font-size: 11.5px; color: #6b7c96; }
  .span2 { grid-column: span 2; }
  .span3 { grid-column: span 3; }
  [hidden] { display: none !important; }

  .card.gold .sub { color: #75530c; }
  .card.red { border: 1px solid #e8cfcb; border-top: 3px solid #b02418; background: #fdf7f6; }

  .tiles { margin-top: 9px; display: grid; gap: 8px; }

<div id="bar">
 <div class="inner">

  </div>

  <div class="panel" id="panelProducts" hidden>

      <span class="note">入力した商品名が本文の「主な対象商品」に反映されます</span>
    </div>
    <div class="grid3" id="productFields"></div>
  </div>

  <div class="panel" id="panelDetail" hidden>
    <div class="grid3" id="detailFields"></div>
  </div>
 </div>
</div>

<div id="sheetWrap">
  <section id="sheet">

      <h1 data-t="title"></h1>
      <div class="accent"></div>
    </div>

    <p class="lead" data-t="lead"></p>

    <div class="cards">
      <div class="card">
        <div class="lbl" data-t="effectiveLabel"></div>
        <div class="big" id="outEffective"></div>
        <div class="sub" data-t="effectiveNote"></div>
      </div>
      <div class="card gold">
        <div class="lbl" data-t="deadlineLabel"></div>
        <div class="big" id="outDeadline"></div>
        <div class="sub" data-t="deadlineNote"></div>
      </div>
      <div class="card red">
        <div class="lbl" data-t="basisLabel"></div>
        <div class="big" data-t="basisTitle"></div>
        <div class="sub" data-t="basisNote"></div>
      </div>
    </div>

    <p class="applynote" data-t="applyNote"></p>

    <div class="caution">
      <span class="tag">ご注意</span>
      <span class="txt" data-t="caution"></span>
    </div>

    <div class="sec">
      <div class="sechead"><span class="num">1</span><h2 data-t="h1"></h2></div>
      <p data-t="s1p1"></p>
      <p data-t="s1p2"></p>
    </div>

    <div class="sec">
      <div class="sechead"><span class="num">2</span><h2 data-t="h2"></h2></div>
      <div class="tiles" id="outTiles"></div>
      <ul class="notes" id="outNotes"></ul>
    </div>

    <p class="closing" data-t="closing"></p>

    <div class="contact">

        <div class="person" id="outPerson" hidden></div>
        <div class="nums">

          <span><span class="k">FAX</span><span id="outFax"></span></span>
        </div>
      </div>
    </div>
  </section>
</div>

  { key: "klee",            label: "Klee One（手書き風）",     stack: "'Klee One', serif" },
  { key: "plex",            label: "IBM Plex Sans JP",         stack: "'IBM Plex Sans JP', sans-serif" },
  { key: "yugothic",        label: "游ゴシック（PC標準）",     stack: "'Yu Gothic', YuGothic, 'Hiragino Kaku Gothic ProN', sans-serif" }
];

const DETAIL = [
  { key: "chief",   label: "所長名",     span: 1 },
  { key: "zip",     label: "郵便番号",   span: 1 },
  { key: "tel",     label: "TEL",        span: 1 },
  { key: "fax",     label: "FAX",        span: 1 },
  { key: "address", label: "住所",       span: 3 }
];

const DEFAULT_PRODUCTS = ["トイレットペーパー", "ペーパータオル", "ティッシュペーパー"];

const BODY_FIELDS = [
  { key: "recipient",      label: "宛名", rows: 1, span: 1, def: "お取引先各位" },
  { key: "title",          label: "タイトル（改行で2行）", rows: 2, span: 1, def: "紙製品価格改定に伴う\nお早めのご発注のお願い" },
  { key: "lead",           label: "冒頭のあいさつ・本文", rows: 4, span: 2, def: "平素より格別のご愛顧を賜り、誠にありがとうございます。このたび、原材料・原燃料価格、物流費、エネルギーコスト、人件費等の上昇を背景としたメーカー・仕入先の価格改定に伴い、下記のとおり一部の紙製品について価格を改定いたします。" },
  { key: "effectiveLabel", label: "左カード見出し", rows: 1, span: 1, def: "改定実施" },
  { key: "effectiveNote",  label: "左カード補足", rows: 1, span: 1, def: "納品分より適用" },
  { key: "deadlineLabel",  label: "中央カード見出し", rows: 1, span: 1, def: "ご発注期日（目安）" },
  { key: "deadlineNote",   label: "中央カード補足", rows: 1, span: 1, def: "納品を確約するものではありません" },
  { key: "basisLabel",     label: "右カード見出し", rows: 1, span: 1, def: "適用基準" },
  { key: "basisTitle",     label: "右カード本文", rows: 1, span: 1, def: "「納品日」を基準" },
  { key: "basisNote",      label: "右カード補足", rows: 1, span: 1, def: "発注日ではありません" },
  { key: "caution",        label: "「ご注意」の一文", rows: 1, span: 1, def: "現在、すでに一部商品で納期遅延が発生しております" },
  { key: "applyNote",      label: "赤字の注記", rows: 3, span: 2, def: "9月30日までにご発注いただいた場合でも、納品が10月1日以降となった商品につきましては、改定後価格が適用されます。対象商品および改定後価格は、別途お渡しするお見積書をご確認ください。" },
  { key: "h1",             label: "見出し 1", rows: 1, span: 1, def: "9月はさらなるご注文・物流の混雑が予想されます" },
  { key: "h2",             label: "見出し 2", rows: 1, span: 1, def: "主な対象商品" },
  { key: "s1p1",           label: "見出し1の本文（前半）", rows: 3, span: 1, def: "価格改定前のご注文の集中に加え、シルバーウィーク前の発注量増加、連休に伴うメーカー・仕入先の稼働日および物流スケジュールへの影響により、通常よりも納品までにお時間をいただく可能性がございます。" },
  { key: "s1p2",           label: "見出し1の本文（後半）", rows: 3, span: 1, def: "メーカー・仕入先の在庫状況や出荷状況によっては、**ご希望の納期に間に合わない場合がございます。**現在の在庫状況や今後のご使用予定をご確認いただき、__できるだけ余裕をもって、お早めにご発注ください__ますようお願いいたします。" },
  { key: "notes",          label: "※ 注記（1行ごとに1項目）", rows: 4, span: 2, def: "現在ご採用いただいている商品によって、価格改定の対象となる商品は異なります。\n対象商品・改定後価格の詳細は、別途お渡しするお見積書をご確認ください。\n早期にご発注いただいた場合でも、メーカー・仕入先の在庫状況、出荷状況、物流状況等により、9月30日までの納品を確約するものではございません。" },
  { key: "closing",        label: "結びの文", rows: 3, span: 2, def: "お客様にはご負担とご不便をおかけいたしますが、何卒事情をご理解賜りますとともに、**お早めのご確認・ご発注にご協力**くださいますようお願い申し上げます。" }
];
const BODY_DEF = {};
BODY_FIELDS.forEach(f => { BODY_DEF[f.key] = f.def; });

const DEFAULTS = { issueISO: "2026-08-19", effectiveISO: "2026-10-01", deadlineISO: "2026-09-06", font: "noto-sans", kichi: false };

/* ============================================================
   永続化（localStorage）
   店舗別: state.offices[営業所名] = { chief, zip, tel, fax, address, contact, mobile }
   文書共通: state.doc = { 案内文, products, 日付, font, kichi }
   ============================================================ */
const KEY = "taiyo-price-letter-v1";
let state = { i: 0, offices: {}, doc: {} };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state.offices = p.offices || {};
      state.doc = p.doc || {};
      if (typeof p.i === "number" && OFFICES[p.i]) state.i = p.i;
    }
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

const office = () => OFFICES[state.i];
const ov = () => state.offices[office().name] || {};
const val = k => { const o = ov(); return o[k] !== undefined && o[k] !== null ? o[k] : (office()[k] || ""); };
const doc = (k, def) => { const v = state.doc[k]; return v !== undefined && v !== null && v !== "" ? v : def; };
const body = k => doc(k, BODY_DEF[k]);

function setOffice(key, value) {
  const n = office().name;
  state.offices[n] = Object.assign({}, state.offices[n], { [key]: value });
  save(); render();
}
function setDoc(key, value) { state.doc[key] = value; save(); render(); }

/* ============================================================
   ヘルパー
   ============================================================ */
// **太字** / __赤下線付き太字__ / 改行 を安全にHTML化
function rich(text) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return String(text == null ? "" : text).split("\n").map(line =>
    line.split(/(\*\*[^*]+\*\*|__[^_]+__)/).map(seg => {
      if (!seg) return "";
      if (seg.startsWith("**") && seg.endsWith("**")) return "<strong>" + esc(seg.slice(2, -2)) + "</strong>";
      if (seg.startsWith("__") && seg.endsWith("__")) return '<strong class="u">' + esc(seg.slice(2, -2)) + "</strong>";
      return esc(seg);
    }).join("")
  ).join("<br />");
}

// ISO(YYYY-MM-DD) → 和文表記。kichiMode=true で「〇年〇月吉日」
function jpDate(iso, kichiMode) {
  const p = String(iso).split("-");
  if (p.length !== 3) return iso;
  const y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
  return kichiMode ? y + "年" + m + "月吉日" : y + "年" + m + "月" + d + "日";
}

const products = () => {
  const p = state.doc.products;
  return (Array.isArray(p) && p.length ? p : DEFAULT_PRODUCTS).slice(0, 6);
};
function setProducts(list) { setDoc("products", list.slice(0, 6)); }

const $ = id => document.getElementById(id);

/* ============================================================
   コントロールバー描画
   ============================================================ */
function buildStaticControls() {
  $("office").innerHTML = OFFICES.map((o, i) => '<option value="' + i + '">' + o.name + "</option>").join("");
  $("font").innerHTML = FONTS.map(f => '<option value="' + f.key + '">' + f.label + "</option>").join("");

  $("bodyFields").innerHTML = BODY_FIELDS.map(f =>
    '<label class="fld' + (f.span === 2 ? " span2" : "") + '"><span>' + f.label +
    '</span><textarea data-body="' + f.key + '" rows="' + f.rows + '"></textarea></label>'
  ).join("");
  $("detailFields").innerHTML = DETAIL.map(f =>
    '<label class="fld' + (f.span === 3 ? " span3" : "") + '"><span>' + f.label +
    '</span><input data-detail="' + f.key + '" /></label>'
  ).join("");

  $("office").addEventListener("change", e => { state.i = Number(e.target.value); save(); render(); });
  $("font").addEventListener("change", e => setDoc("font", e.target.value));
  $("contact").addEventListener("input", e => setOffice("contact", e.target.value));
  $("mobile").addEventListener("input", e => setOffice("mobile", e.target.value));
  $("issueISO").addEventListener("change", e => setDoc("issueISO", e.target.value));
  $("effectiveISO").addEventListener("change", e => setDoc("effectiveISO", e.target.value));
  $("deadlineISO").addEventListener("change", e => setDoc("deadlineISO", e.target.value));
  $("btnKichi").addEventListener("click", () => setDoc("kichi", !doc("kichi", DEFAULTS.kichi)));

  document.querySelectorAll("[data-body]").forEach(el =>
    el.addEventListener("input", e => setDoc(el.dataset.body, e.target.value)));
  document.querySelectorAll("[data-detail]").forEach(el =>
    el.addEventListener("input", e => setOffice(el.dataset.detail, e.target.value)));

  const toggle = (btn, panel, on, off) => $(btn).addEventListener("click", () => {
    const p = $(panel);
    p.hidden = !p.hidden;
    $(btn).textContent = p.hidden ? off : on;
  });
  toggle("tglBody", "panelBody", "案内文を閉じる", "案内文を編集");
  toggle("tglProducts", "panelProducts", "対象商品を閉じる", "対象商品を編集");
  toggle("tglDetail", "panelDetail", "所長名・住所などを閉じる", "所長名・住所などを編集");

  $("btnAddProduct").addEventListener("click", () => setProducts(products().concat(["新しい商品"])));
  $("btnResetBody").addEventListener("click", () => {
    BODY_FIELDS.forEach(f => { delete state.doc[f.key]; });
    save(); render();
  });
  $("btnReset").addEventListener("click", () => { delete state.offices[office().name]; save(); render(); });
  $("btnPrint").addEventListener("click", () => window.print());
  $("btnPdf").addEventListener("click", exportPdf);
}

function renderProductFields() {
  const list = products();
  $("productFields").innerHTML = list.map((name, i) =>
    '<label class="fld"><span>商品 ' + (i + 1) + '</span><div style="display:flex; gap:6px;">' +
    '<input data-product="' + i + '" placeholder="商品名" style="flex:1; min-width:0;" />' +
    (list.length > 1 ? '<button class="btn-del" data-remove="' + i + '">削除</button>' : "") +
    "</div></label>"
  ).join("");
  list.forEach((name, i) => {
    const input = document.querySelector('[data-product="' + i + '"]');
    input.value = name;
    input.addEventListener("input", e => {
      const next = products().slice();
      next[i] = e.target.value;
      state.doc.products = next.slice(0, 6);
      save(); renderSheet();
    });
  });
  document.querySelectorAll("[data-remove]").forEach(b =>
    b.addEventListener("click", () => setProducts(products().filter((x, k) => k !== Number(b.dataset.remove)))));
  $("btnAddProduct").hidden = list.length >= 6;
}

/* ============================================================
   A4 本文描画
   ============================================================ */
function renderSheet() {
  const fontKey = doc("font", DEFAULTS.font);
  const font = FONTS.find(f => f.key === fontKey) || FONTS[0];
  $("sheet").style.fontFamily = font.stack;

  document.querySelectorAll("#sheet [data-t]").forEach(el => { el.innerHTML = rich(body(el.dataset.t)); });

  const kichi = !!doc("kichi", DEFAULTS.kichi);
  $("outIssue").textContent = jpDate(doc("issueISO", DEFAULTS.issueISO), kichi);
  $("outEffective").textContent = jpDate(doc("effectiveISO", DEFAULTS.effectiveISO), false);
  $("outDeadline").textContent = jpDate(doc("deadlineISO", DEFAULTS.deadlineISO), false);

  $("outOffice").textContent = office().name;
  $("outOffice2").textContent = office().name;
  $("outChief").textContent = val("chief");
  $("outZip").textContent = val("zip");
  $("outAddress").textContent = val("address");
  $("outTel").textContent = val("tel");
  $("outFax").textContent = val("fax");

  const c = val("contact"), m = val("mobile");
  const line = c && m ? c + "　（携帯：" + m + "）" : (c || (m ? "（携帯：" + m + "）" : ""));
  $("outPerson").hidden = !line;
  $("outPerson").innerHTML = line ? "担当　" + rich(line) : "";

  const list = products();
  const tiles = $("outTiles");
  tiles.style.gridTemplateColumns = "repeat(" + Math.min(list.length, 3) + ", minmax(0, 1fr))";
  tiles.innerHTML = list.map(n => '<div class="tile">' + rich(n) + "</div>").join("");

  $("outNotes").innerHTML = String(body("notes")).split("\n").filter(t => t.trim())
    .map(t => "<li>※ " + rich(t) + "</li>").join("");
}

function renderControls() {
  $("office").value = String(state.i);
  $("font").value = doc("font", DEFAULTS.font);
  $("contact").value = val("contact");
  $("mobile").value = val("mobile");
  $("issueISO").value = doc("issueISO", DEFAULTS.issueISO);
  $("effectiveISO").value = doc("effectiveISO", DEFAULTS.effectiveISO);
  $("deadlineISO").value = doc("deadlineISO", DEFAULTS.deadlineISO);
  $("btnKichi").classList.toggle("on", !!doc("kichi", DEFAULTS.kichi));
  document.querySelectorAll("[data-body]").forEach(el => { el.value = body(el.dataset.body); });
  document.querySelectorAll("[data-detail]").forEach(el => { el.value = val(el.dataset.detail); });
  renderProductFields();
}

function render() { renderControls(); renderSheet(); }

/* ============================================================
   PDF 出力（html2pdf.js → A4 1ページ）
   ============================================================ */
let busy = false;
function exportPdf() {
  const node = $("sheet");
  if (busy) return;
  if (!window.html2pdf) { window.print(); return; }
  busy = true;
  $("btnPdf").textContent = "PDF作成中…";
  window.html2pdf().set({
    margin: 0,
    filename: "価格改定のご案内_" + office().name + ".pdf",
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: { scale: 3, useCORS: true, backgroundColor: "#ffffff" },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
  }).from(node).save()
    .then(done).catch(done);
  function done() { busy = false; $("btnPdf").textContent = "PDFをダウンロード"; }
}

load();
buildStaticControls();
render();
</script>
